{{template "head"}}
<h1>Run a service</h1>
<p class="muted">More than one service? Use a <a href="/stacks/new">stack</a>.</p>

<form hx-post="/services" hx-swap="none">
  <label>Name<br><input name="name" placeholder="api" autofocus></label>
  <label>Image<br><input name="image" placeholder="ghcr.io/me/api:v1"></label>
  <label>Replicas<br><input name="replicas" value="1" style="min-width:6rem"></label>
  <label>Ports<br>
    <textarea name="ports" rows="2" placeholder="8080:80"></textarea></label>
  <label>Environment<br>
    <textarea name="env" rows="3" placeholder="LOG_LEVEL=info"></textarea></label>
  <label>Networks<br>
    <textarea name="networks" rows="2" placeholder="appnet"></textarea></label>
  <button>Create</button> <a href="/">cancel</a>
</form>
{{template "foot"}}
