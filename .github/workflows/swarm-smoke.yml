name: Swarm smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/swarm-smoke.yml
      - scripts/dev-cluster.sh
      - scripts/smoke-private-registry.sh

permissions:
  contents: read

jobs:
  private-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sh scripts/smoke-private-registry.sh
