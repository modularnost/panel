version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*bytes.Buffer).WriteTo
        - (*encoding/json.Encoder).Encode
        - (*html/template.Template).Execute
        - io.WriteString
  exclusions:
    presets:
      - std-error-handling
